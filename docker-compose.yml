name: lead-intelligence-platform

services:
  db:
    image: postgres:16-alpine
    container_name: lip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadflow_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-leadflow}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadflow} -d ${POSTGRES_DB:-leadflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lip-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadflow_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-leadflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-leadflow}:${POSTGRES_PASSWORD:-leadflow_dev_pw}@db:5432/${POSTGRES_DB:-leadflow}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars-min}
      BACKEND_PORT: 8002
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: INFO
      SYNTHETIC_SEED: ${SYNTHETIC_SEED:-20261022}
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      start_period: 240s    # 4 min: full pipeline (seed 40s + score 90s + route 10s + tasks 15s + opps 10s) needs ~165s + slack
      retries: 10           # 10 × 15s = 150s grace after start_period expires

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lip-frontend
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
    name: lip_pg_data